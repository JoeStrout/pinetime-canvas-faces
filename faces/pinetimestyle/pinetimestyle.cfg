text 2 177 color=#008080 "P\nM" if clock12=1 hour>=12
rect 200 0 40 240 color=#008080
battery 224 2 color=#000000 if charging=0
text 222 2 color=#000000 "{plug}" if charging=1
text 210 2 color=#000000 align=center "{ble}"
text 5 5 color=#008080 "{notify}"
rect 203 103 34 34 color=#000000
rect 206 106 27 27 color=#FFFFFF
rect 212 100 3 12 color=#000000
rect 224 100 3 12 color=#000000
rect 210 109 8 3 color=#000000
rect 222 109 8 3 color=#000000
text 220 76 color=#000000 align=center case=upper "{ddd}"
text 220 111 color=#000000 align=center "{day}"
text 220 140 color=#000000 align=center case=upper "{MMM}"
ticks 203 200 34 34 count=10 inner=13 width=4 color=#000000
hand steps 207 204 26 26 radius=13 width=3 color=#FFFFFF
