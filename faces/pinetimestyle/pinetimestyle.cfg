requires 1
name PineTimeStyle
text 105 5 font=open_sans_light color=#008080 align=center "{HH}" if clock12=0
text 105 5 font=open_sans_light color=#008080 align=center "{hh}" if clock12=1
text 105 125 font=open_sans_light color=#008080 align=center "{mm}"
