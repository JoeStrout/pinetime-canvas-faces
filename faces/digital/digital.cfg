text 120 168 color=#999999 align=center case=upper "{ddd} {MMM} {D} {YYYY}" if clock12=1
text 0 217 color=#1B1B1B "{heart}" if hrOn=0
text 0 217 color=#CE1B1B "{heart}" if hrOn=1
